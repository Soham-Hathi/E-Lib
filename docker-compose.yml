services:
  mongodb:
    image: mongo:7-jammy
    container_name: elibrary_mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: bookstore
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: elibrary_backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/bookstore
      - JWT_SECRET_KEY=change_this_to_a_secure_random_key_in_production
    depends_on:
      - mongodb

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: elibrary_frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: elibrary_admin
    restart: always
    ports:
      - "5174:80"
    depends_on:
      - backend

volumes:
  mongo_data:
